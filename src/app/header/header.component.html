<header class="header">
  <div class="header-shell">
    <nav class="nav" aria-label="Primary navigation">
      <button
        class="nav-button icon-button theme-button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDarkMode ? 'Light mode' : 'Dark mode'">
        <span aria-hidden="true">{{ isDarkMode ? '☀' : '☾' }}</span>
      </button>
      <button class="nav-button" (click)="scrollToWork()">Work</button>
      <button class="nav-button" (click)="scrollToProjects()">Projects</button>
      <button class="nav-button" (click)="openCV()">CV</button>
      <div class="contact-dropdown">
        <button class="contact-button" (click)="toggleContactDropdown()" [attr.aria-expanded]="isContactDropdownOpen">
          Contact
          <span class="dropdown-arrow" [class.open]="isContactDropdownOpen">▼</span>
        </button>
        <div class="dropdown-menu" [class.open]="isContactDropdownOpen">
          <a href="#" (click)="openGithub(); $event.preventDefault()" class="dropdown-item">
            GitHub Profile
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              <path d="M10.5 2a.5.5 0 0 0 0 1h2.793L6.146 10.146a.5.5 0 0 0 .708.708L14 3.707V6.5a.5.5 0 0 0 1 0v-4a.5.5 0 0 0-.5-.5h-4z"/>
              <path d="M13.5 13.5h-11v-11h5a.5.5 0 0 0 0-1h-5A1.5 1.5 0 0 0 1 3.5v11A1.5 1.5 0 0 0 2.5 16h11a1.5 1.5 0 0 0 1.5-1.5v-5a.5.5 0 0 0-1 0v5z"/>
            </svg>
          </a>
          <a href="#" (click)="openLinkedIn(); $event.preventDefault()" class="dropdown-item">
            LinkedIn Profile
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              <path d="M10.5 2a.5.5 0 0 0 0 1h2.793L6.146 10.146a.5.5 0 0 0 .708.708L14 3.707V6.5a.5.5 0 0 0 1 0v-4a.5.5 0 0 0-.5-.5h-4z"/>
              <path d="M13.5 13.5h-11v-11h5a.5.5 0 0 0 0-1h-5A1.5 1.5 0 0 0 1 3.5v11A1.5 1.5 0 0 0 2.5 16h11a1.5 1.5 0 0 0 1.5-1.5v-5a.5.5 0 0 0-1 0v5z"/>
            </svg>
          </a>
          <a href="#" (click)="openGoogleScholar(); $event.preventDefault()" class="dropdown-item">
            Google Scholar Profile
          </a>
          <a href="#" (click)="openEmail(); $event.preventDefault()" class="dropdown-item">
            Email : <i>{{ profiles.email }}</i>
          </a>
        </div>
      </div>
    </nav>
  </div>
</header>
